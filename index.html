<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>해리포터 모험 게임 - 마법사의 돌</title>
    <meta property="og:title" content="해리포터 모험 게임 - 마법사의 돌">
    <meta property="og:description" content="해리, 론, 헤르미온느 중 한 명을 선택하여 마법사의 돌 모험을 시작하세요!">
    <meta property="og:image" content="https://images.unsplash.com/photo-1519682337058-a94d519337bc?w=1200&h=630&fit=crop&q=80">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1519682337058-a94d519337bc?w=1200&h=630&fit=crop&q=80">
    <meta property="og:type" content="website">
    
    <!-- 모바일 홈 화면 아이콘 (귀여운 마법사) -->
    <link rel="icon" type="image/png" sizes="192x192" href="icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="해리포터 모험">
    <meta name="theme-color" content="#1a1a2e">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="character-selection" class="screen active" style="display: block !important;">
            <h1>🪄 해리포터 모험 게임 🪄</h1>
            <h2>마법사의 돌</h2>
            <p class="intro">모험을 시작할 주인공을 선택하세요!</p>
            <div class="character-cards">
                <button class="character-card" data-character="harry" onclick="startGame('harry')" style="background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%); border: 3px solid #ffd700; border-radius: 15px; padding: 30px; text-align: center; cursor: pointer; min-width: 200px; max-width: 250px; color: white; font-family: inherit;">
                    <div class="character-icon" style="font-size: 4em; margin-bottom: 15px;">👓</div>
                    <h3 style="font-size: 1.5em; margin-bottom: 10px; color: #ffd700;">해리 포터</h3>
                    <p style="font-size: 1em; color: #b0b0b0;">유명한 소년 마법사</p>
                </button>
                <button class="character-card" data-character="ron" onclick="startGame('ron')" style="background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%); border: 3px solid #ffd700; border-radius: 15px; padding: 30px; text-align: center; cursor: pointer; min-width: 200px; max-width: 250px; color: white; font-family: inherit;">
                    <div class="character-icon" style="font-size: 4em; margin-bottom: 15px;">🧡</div>
                    <h3 style="font-size: 1.5em; margin-bottom: 10px; color: #ffd700;">론 위즐리</h3>
                    <p style="font-size: 1em; color: #b0b0b0;">충실한 친구</p>
                </button>
                <button class="character-card" data-character="hermione" onclick="startGame('hermione')" style="background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%); border: 3px solid #ffd700; border-radius: 15px; padding: 30px; text-align: center; cursor: pointer; min-width: 200px; max-width: 250px; color: white; font-family: inherit;">
                    <div class="character-icon" style="font-size: 4em; margin-bottom: 15px;">📚</div>
                    <h3 style="font-size: 1.5em; margin-bottom: 10px; color: #ffd700;">헤르미온느 그레인저</h3>
                    <p style="font-size: 1em; color: #b0b0b0;">똑똑한 마법사</p>
                </button>
            </div>
        </div>

        <div id="game-screen" class="screen" style="display: none !important;">
            <div class="game-header">
                <div class="character-info">
                    <span id="current-character-name"></span>
                    <span class="event-counter">이벤트 <span id="event-number">1</span>/10</span>
                </div>
            </div>
            <div class="story-container" id="story-container">
                <div class="story-image-container" id="story-image-container"></div>
                <h2 id="ending-title" class="ending-title" style="display: none;"></h2>
                <div id="story-text" class="story-text"></div>
            </div>
            <div id="stats-graph-container" class="stats-graph-container" style="display: none;">
                <h3 class="stats-title">최종 수치</h3>
                <div class="stats-graph">
                    <div class="stat-item">
                        <div class="stat-label">
                            <span>우정</span>
                            <span id="friendship-value" class="stat-value">0</span>
                        </div>
                        <div class="stat-bar-container">
                            <div id="friendship-bar" class="stat-bar friendship-bar" style="width: 0%;"></div>
                        </div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">
                            <span>용기</span>
                            <span id="courage-value" class="stat-value">0</span>
                        </div>
                        <div class="stat-bar-container">
                            <div id="courage-bar" class="stat-bar courage-bar" style="width: 0%;"></div>
                        </div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">
                            <span>지식</span>
                            <span id="knowledge-value" class="stat-value">0</span>
                        </div>
                        <div class="stat-bar-container">
                            <div id="knowledge-bar" class="stat-bar knowledge-bar" style="width: 0%;"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="choices-container" class="choices-container"></div>
            <button id="restart-btn" class="restart-btn" style="display: none;">다시 시작하기</button>
        </div>

        <div id="choice-confirm-screen" class="screen" style="display: none;">
            <div class="confirm-container">
                <h2>선택 확인</h2>
                <div id="confirm-choice-text" class="confirm-choice-text"></div>
                <div class="confirm-buttons">
                    <button id="confirm-yes" class="confirm-btn">확인</button>
                    <button id="confirm-no" class="confirm-btn">취소</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 효과음 -->
    <audio id="clickSound" preload="auto">
        <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYIGWi77+efTRAMUKfj8LZjHAY4kdfyzHksBSR3x/DdkEAKFF606euoVRQKRp/g8r5sIQUrgc7y2Yk2CBlou+/nn00QDFCn4/C2YxwGOJHX8sx5LAUkd8fw3ZBAC" type="audio/wav">
    </audio>
    
    <script src="game.js"></script>
    <script>
        // game.js 로드 확인
        console.log('game.js 로드 완료');
        console.log('startGame 함수 존재:', typeof window.startGame);
        
        // 캐릭터 카드 클릭 테스트
        document.addEventListener('DOMContentLoaded', function() {
            const cards = document.querySelectorAll('.character-card');
            console.log('캐릭터 카드 개수:', cards.length);
            cards.forEach(function(card, index) {
                const character = card.getAttribute('data-character');
                console.log('카드 ' + index + ':', character, 'onclick:', card.getAttribute('onclick'));
            });
        });
    </script>
</body>
</html>
