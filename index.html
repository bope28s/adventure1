<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>해리포터 모험 게임 - 마법사의 돌</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="character-selection" class="screen active" style="display: block !important;">
            <h1>🪄 해리포터 모험 게임 🪄</h1>
            <h2>마법사의 돌</h2>
            <p class="intro">모험을 시작할 주인공을 선택하세요!</p>
            <div class="character-cards">
                <button class="character-card" data-character="harry" onclick="startGame('harry')" style="background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%); border: 3px solid #ffd700; border-radius: 15px; padding: 30px; text-align: center; cursor: pointer; min-width: 200px; max-width: 250px; color: white; font-family: inherit;">
                    <div class="character-icon" style="font-size: 4em; margin-bottom: 15px;">👓</div>
                    <h3 style="font-size: 1.5em; margin-bottom: 10px; color: #ffd700;">해리 포터</h3>
                    <p style="font-size: 1em; color: #b0b0b0;">유명한 소년 마법사</p>
                </button>
                <button class="character-card" data-character="ron" onclick="startGame('ron')" style="background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%); border: 3px solid #ffd700; border-radius: 15px; padding: 30px; text-align: center; cursor: pointer; min-width: 200px; max-width: 250px; color: white; font-family: inherit;">
                    <div class="character-icon" style="font-size: 4em; margin-bottom: 15px;">🧡</div>
                    <h3 style="font-size: 1.5em; margin-bottom: 10px; color: #ffd700;">론 위즐리</h3>
                    <p style="font-size: 1em; color: #b0b0b0;">충실한 친구</p>
                </button>
                <button class="character-card" data-character="hermione" onclick="startGame('hermione')" style="background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%); border: 3px solid #ffd700; border-radius: 15px; padding: 30px; text-align: center; cursor: pointer; min-width: 200px; max-width: 250px; color: white; font-family: inherit;">
                    <div class="character-icon" style="font-size: 4em; margin-bottom: 15px;">📚</div>
                    <h3 style="font-size: 1.5em; margin-bottom: 10px; color: #ffd700;">헤르미온느 그레인저</h3>
                    <p style="font-size: 1em; color: #b0b0b0;">똑똑한 마녀</p>
                </button>
            </div>
        </div>

        <div id="game-screen" class="screen" style="display: none !important;">
            <div class="game-header">
                <div class="character-info">
                    <span id="current-character-name"></span>
                    <span class="event-counter">이벤트 <span id="event-number">1</span>/10</span>
                </div>
            </div>
            <div class="story-container">
                <div id="story-text" class="story-text"></div>
            </div>
            <div id="choices-container" class="choices-container"></div>
            <button id="restart-btn" class="restart-btn" style="display: none;">다시 시작하기</button>
        </div>
    </div>
    <script>
        // 디버깅: startGame이 호출되는지 확인
        console.log('HTML 로드 완료');
        
        // 임시 startGame 함수 (game.js가 로드되기 전까지)
        window.startGame = window.startGame || function(character) {
            console.log('임시 startGame 호출:', character);
            // game.js가 로드될 때까지 대기
            if (typeof window.startGame === 'function' && window.startGame.toString().includes('currentCharacter')) {
                window.startGame(character);
            } else {
                setTimeout(function() {
                    if (typeof window.startGame === 'function') {
                        console.log('game.js 로드 후 startGame 호출');
                        window.startGame(character);
                    } else {
                        console.error('startGame 함수를 찾을 수 없습니다.');
                        alert('게임을 로드하는 중입니다. 잠시 후 다시 시도해주세요.');
                    }
                }, 100);
            }
        };
    </script>
    <script src="game.js"></script>
    <script>
        // game.js 로드 확인
        console.log('game.js 로드 완료');
        console.log('startGame 함수 존재:', typeof window.startGame);
        
        // 캐릭터 카드 클릭 테스트
        document.addEventListener('DOMContentLoaded', function() {
            const cards = document.querySelectorAll('.character-card');
            console.log('캐릭터 카드 개수:', cards.length);
            cards.forEach(function(card, index) {
                const character = card.getAttribute('data-character');
                console.log('카드 ' + index + ':', character, 'onclick:', card.getAttribute('onclick'));
            });
        });
    </script>
</body>
</html>
