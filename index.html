<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>해리포터 모험 게임 - 마법사의 돌</title>
    <meta property="og:title" content="해리포터 모험 게임 - 마법사의 돌">
    <meta property="og:description" content="해리, 론, 헤르미온느 중 한 명을 선택하여 마법사의 돌 모험을 시작하세요!">
    <meta property="og:image" content="icon2.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="icon2.png">
    <meta property="og:type" content="website">
    
    <!-- 모바일 홈 화면 아이콘 (귀여운 마법사) -->
    <link rel="icon" type="image/png" sizes="192x192" href="icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="해리포터 모험">
    <meta name="theme-color" content="#1a1a2e">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="splash-screen" class="splash-screen" style="display: flex !important;">
        <img src="icon2.png" alt="해리포터 모험 게임" class="splash-image">
    </div>
    <div class="container">
        <div id="part-selection" class="screen active" style="display: none !important;">
            <h1>해리포터 모험 게임</h1>
            <p class="intro">플레이할 편을 선택하세요!</p>
            <div class="part-cards">
                <button class="part-card" onclick="selectPart(1)" style="background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%); border: 3px solid #ffd700; border-radius: 15px; padding: 30px; cursor: pointer; min-width: 250px; max-width: 300px; color: white; font-family: inherit;">
                    <h3 style="font-size: 1.8em; margin-bottom: 15px; color: #ffd700; text-align: center;">제 1편</h3>
                    <h4 style="font-size: 1.4em; margin-bottom: 10px; color: #ffd700; text-align: center;">마법사의 돌</h4>
                    <p style="font-size: 1em; color: #b0b0b0; text-align: center; margin: 0;">해리의 첫 해</p>
                </button>
                <button class="part-card" onclick="selectPart(2)" style="background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%); border: 3px solid #ffd700; border-radius: 15px; padding: 30px; cursor: pointer; min-width: 250px; max-width: 300px; color: white; font-family: inherit;">
                    <h3 style="font-size: 1.8em; margin-bottom: 15px; color: #ffd700; text-align: center;">제 2편</h3>
                    <h4 style="font-size: 1.4em; margin-bottom: 10px; color: #ffd700; text-align: center;">비밀의 방</h4>
                    <p style="font-size: 1em; color: #b0b0b0; text-align: center; margin: 0;">미지의 위험</p>
                </button>
                <button class="part-card" onclick="selectPart(3)" style="background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%); border: 3px solid #ffd700; border-radius: 15px; padding: 30px; cursor: pointer; min-width: 250px; max-width: 300px; color: white; font-family: inherit;">
                    <h3 style="font-size: 1.8em; margin-bottom: 15px; color: #ffd700; text-align: center;">제 3편</h3>
                    <h4 style="font-size: 1.4em; margin-bottom: 10px; color: #ffd700; text-align: center;">아즈카반의 죄수</h4>
                    <p style="font-size: 1em; color: #b0b0b0; text-align: center; margin: 0;">탈출한 죄수</p>
                </button>
            </div>
        </div>

        <div id="character-selection" class="screen" style="display: none !important;">
            <h1>해리포터 모험 게임</h1>
            <h2 id="part-title">제 1편 : 마법사의 돌</h2>
            <p class="intro">모험을 시작할 주인공을 선택하세요!</p>
            <div class="character-cards">
                <button class="character-card" data-character="harry" onclick="startGame('harry')" style="background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%); border: 3px solid #ffd700; border-radius: 15px; padding: 20px; cursor: pointer; min-width: 200px; max-width: 250px; color: white; font-family: inherit;">
                    <div class="character-icon">
                        <img src="image/Harry.png" alt="해리 포터" style="width: 120px; height: 120px; object-fit: contain;">
                    </div>
                    <div class="character-info-text">
                        <h3 style="font-size: 1.5em; margin-bottom: 10px; color: #ffd700; text-align: left;">해리 포터</h3>
                        <p style="font-size: 1em; color: #b0b0b0; text-align: left; margin: 0;">유명한 마법사</p>
                    </div>
                </button>
                <button class="character-card" data-character="ron" onclick="startGame('ron')" style="background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%); border: 3px solid #ffd700; border-radius: 15px; padding: 20px; cursor: pointer; min-width: 200px; max-width: 250px; color: white; font-family: inherit;">
                    <div class="character-icon">
                        <img src="image/Ron.png" alt="론 위즐리" style="width: 120px; height: 120px; object-fit: contain;">
                    </div>
                    <div class="character-info-text">
                        <h3 style="font-size: 1.5em; margin-bottom: 10px; color: #ffd700; text-align: left;">론 위즐리</h3>
                        <p style="font-size: 1em; color: #b0b0b0; text-align: left; margin: 0;">충실한 친구</p>
                    </div>
                </button>
                <button class="character-card" data-character="hermione" onclick="startGame('hermione')" style="background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%); border: 3px solid #ffd700; border-radius: 15px; padding: 20px; cursor: pointer; min-width: 200px; max-width: 250px; color: white; font-family: inherit;">
                    <div class="character-icon">
                        <img src="image/Hermione.png" alt="헤르미온느 그레인저" style="width: 120px; height: 120px; object-fit: contain;">
                    </div>
                    <div class="character-info-text">
                        <h3 style="font-size: 1.5em; margin-bottom: 10px; color: #ffd700; text-align: left;">헤르미온느 그레인저</h3>
                        <p style="font-size: 1em; color: #b0b0b0; text-align: left; margin: 0;">똑똑한 마법사</p>
                    </div>
                </button>
            </div>
        </div>

        <div id="game-screen" class="screen" style="display: none !important;">
            <div class="game-header">
                <div class="character-info">
                    <img id="current-character-icon" src="" alt="" style="width: 40px; height: 40px; object-fit: contain; margin-right: 10px; display: none;">
                    <span id="current-character-name"></span>
                    <span class="event-counter"><span id="event-number">1</span>/10</span>
                </div>
            </div>
            <div class="story-container" id="story-container">
                <div class="story-image-container" id="story-image-container"></div>
                <h2 id="ending-title" class="ending-title" style="display: none;"></h2>
                <div id="story-text" class="story-text"></div>
            </div>
            <div id="stats-graph-container" class="stats-graph-container" style="display: none;">
                <div class="stats-graph">
                    <div class="stat-item">
                        <div class="stat-label">
                            <span>우정</span>
                            <span id="friendship-value" class="stat-value">0</span>
                        </div>
                        <div class="stat-bar-container">
                            <div id="friendship-bar" class="stat-bar friendship-bar" style="width: 0%;"></div>
                        </div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">
                            <span>용기</span>
                            <span id="courage-value" class="stat-value">0</span>
                        </div>
                        <div class="stat-bar-container">
                            <div id="courage-bar" class="stat-bar courage-bar" style="width: 0%;"></div>
                        </div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">
                            <span>지식</span>
                            <span id="knowledge-value" class="stat-value">0</span>
                        </div>
                        <div class="stat-bar-container">
                            <div id="knowledge-bar" class="stat-bar knowledge-bar" style="width: 0%;"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="original-match-container" class="original-match-text-container" style="display: none; margin-top: 20px; text-align: center; padding: 20px;">
                <p class="original-match-text" style="font-size: 1.5em; color: #ffd700; line-height: 1.8;">
                    당신의 선택은 원래 이야기와 <span id="original-match-value" class="match-percentage" style="font-size: 1.3em; font-weight: bold; color: #ffffff; display: inline-block; min-width: 60px;">0</span>% 똑같군요!
                </p>
            </div>
            <div id="choices-container" class="choices-container"></div>
            <button id="restart-btn" class="restart-btn" style="display: none;">다시 시작하기</button>
        </div>

        <div id="choice-confirm-screen" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 1000; justify-content: center; align-items: center;">
            <div class="confirm-container">
                <h2>선택 확인</h2>
                <div id="confirm-choice-text" class="confirm-choice-text"></div>
                <div class="confirm-buttons">
                    <button id="confirm-yes" class="confirm-btn">확인</button>
                    <button id="confirm-no" class="confirm-btn">취소</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 효과음 -->
    <audio id="clickSound" preload="auto">
        <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYIGWi77+efTRAMUKfj8LZjHAY4kdfyzHksBSR3x/DdkEAKFF606euoVRQKRp/g8r5sIQUrgc7y2Yk2CBlou+/nn00QDFCn4/C2YxwGOJHX8sx5LAUkd8fw3ZBAC" type="audio/wav">
    </audio>
    
    <!-- 화면 전환 효과음 (마법 효과) -->
    <audio id="transitionSound" preload="auto">
        <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYIGWi77+efTRAMUKfj8LZjHAY4kdfyzHksBSR3x/DdkEAKFF606euoVRQKRp/g8r5sIQUrgc7y2Yk2CBlou+/nn00QDFCn4/C2YxwGOJHX8sx5LAUkd8fw3ZBAC" type="audio/wav">
    </audio>
    
    <!-- 결말 효과음 (승리/성공) -->
    <audio id="endingSound" preload="auto">
        <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYIGWi77+efTRAMUKfj8LZjHAY4kdfyzHksBSR3x/DdkEAKFF606euoVRQKRp/g8r5sIQUrgc7y2Yk2CBlou+/nn00QDFCn4/C2YxwGOJHX8sx5LAUkd8fw3ZBAC" type="audio/wav">
    </audio>
    
    <script src="game.js"></script>
    <script>
        // game.js 로드 확인
        console.log('game.js 로드 완료');
        console.log('startGame 함수 존재:', typeof window.startGame);
        
        // 스플래시 화면 처리
        document.addEventListener('DOMContentLoaded', function() {
            const splashScreen = document.getElementById('splash-screen');
            const partSelection = document.getElementById('part-selection');
            
            // 2초 후 스플래시 화면 숨기고 첫 화면 표시
            setTimeout(function() {
                if (splashScreen) {
                    splashScreen.style.display = 'none';
                }
                if (partSelection) {
                    partSelection.style.display = 'block';
                    partSelection.classList.add('active');
                    createSound('transition');
                }
            }, 2500); // 2.5초 (애니메이션 시간 포함)
            
            // 캐릭터 카드 클릭 테스트
            const cards = document.querySelectorAll('.character-card');
            console.log('캐릭터 카드 개수:', cards.length);
            cards.forEach(function(card, index) {
                const character = card.getAttribute('data-character');
                console.log('카드 ' + index + ':', character, 'onclick:', card.getAttribute('onclick'));
            });
        });
    </script>
</body>
</html>
